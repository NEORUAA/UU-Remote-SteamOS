<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" role="img" aria-labelledby="title desc"><title id="title">Desktop backend</title><desc id="desc">Desktop backend</desc><style>text{font-family:"Avenir Next","PingFang SC","Noto Sans CJK SC",sans-serif}.signal{stroke-dasharray:18 142;stroke-dashoffset:0;animation:travel 4.8s linear infinite}.return{animation-delay:-2.4s}@keyframes travel{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.signal{animation:none;display:none}}</style><defs><linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55e5c2"/><stop offset="1" stop-color="#0aa0b2"/></linearGradient><linearGradient id="cobalt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7cbbfa"/><stop offset="1" stop-color="#4d63de"/></linearGradient><marker id="mintArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#159fae" stroke-width="2"/></marker><marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#536ee5" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1774" height="887" rx="0" fill="#f8f8f4" stroke="none"/><text x="80" y="55" fill="#717d87" font-size="17" font-weight="650" text-anchor="start">UU REMOTE / UBUNTU PLUS</text><text x="80" y="134" fill="#222733" font-size="55" font-weight="750" text-anchor="start">One bridge. Three layers.</text><text x="83" y="178" fill="#717d87" font-size="23" font-weight="400" text-anchor="start">Keep the relay core. Adapt distribution and desktop integration.</text><rect x="80" y="250" width="500" height="483" rx="25" fill="white" stroke="#dce3e4"/><text x="108" y="298" fill="#099fac" font-size="22" font-weight="700" text-anchor="start">01</text><text x="108" y="343" fill="#222733" font-size="31" font-weight="700" text-anchor="start">Bridge core</text><text x="108" y="377" fil