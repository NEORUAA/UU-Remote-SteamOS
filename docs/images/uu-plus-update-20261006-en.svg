<text x="774.859375" y="281" font-size="18" font-weight="700" fill="#087f85">OPT-IN</text>
<text x="100" y="346" font-size="35" font-weight="700" fill="#087f85">Pick up where you left off</text>
<text x="100" y="396" font-size="25" font-weight="400" fill="#20212a">Keep the shell, directory and jobs after reconnecting.</text>
<text x="100" y="430" font-size="25" font-weight="400" fill="#20212a">Enable persistent mode in the terminal guide.</text>
<text x="100" y="464" font-size="25" font-weight="400" fill="#20212a">Fresh sessions remain the install default.</text>
