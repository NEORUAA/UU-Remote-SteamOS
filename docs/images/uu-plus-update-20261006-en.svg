<text x="929" y="611" font-size="29" font-weight="700" fill="#20212a">Native CPU / GPU capture</text>
<rect x="1517.4" y="586" width="160.6" height="33" rx="16" fill="#7954c9" opacity="0.11"/>
<text x="1533.4375" y="609" font-size="18" font-weight="700" fill="#7954c9">EXPERIMENTAL</text>
<text x="929" y="674" font-size="35" font-weight="700" fill="#7954c9">Explore a different capture path</text>
<text x="929" y="724" font-size="25" font-weight="400" fill="#20212a">Optional native capture prototypes for developers.</text>
<text x="929" y="758" font-size="25" font-weight="400" fill="#20212a">Not part of the default installer.</text>
<text x="929" y="792" font-size="25" font-weight="400" fill="#20212a">CPU: MIT · Independent GPU component: AGPL-3.0.</text>
