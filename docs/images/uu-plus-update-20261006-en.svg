<text x="100" y="674" font-size="35" font-weight="700" fill="#c76520">Preserve the original PNG</text>
<text x="100" y="724" font-size="25" font-weight="400" fill="#20212a">Offer PNG alongside DIBV5 / DIB formats.</text>
<text x="100" y="758" font-size="25" font-weight="400" fill="#20212a">Optional Mac helper adds TIFF for PNG copies.</text>
<text x="100" y="792" font-size="25" font-weight="400" fill="#20212a">Current Ubuntu → Mac synchronization is still open.</text>
