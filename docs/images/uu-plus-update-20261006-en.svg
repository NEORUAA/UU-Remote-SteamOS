<text x="100" y="942" font-size="29" font-weight="700" fill="#c76520">Known limits: outgoing files and folders are not implemented.</text>
<text x="100" y="981" font-size="25" font-weight="400" fill="#20212a">Dual-controller focus loss remains open. See the working-version notes.</text>
<text x="100" y="1013" font-size="25" font-weight="400" fill="#20212a">720p · 1080p · 1440p · 4K canvas choices remain available.</text>
<text x="72" y="1084" font-size="20" font-weight="400" fill="#686976">Development source · Optional features have setup guides · Native capture remains experimental.</text>
