<rect x="901" y="259" width="5" height="45" rx="2" fill="#087f85"/>
<text x="929" y="283" font-size="29" font-weight="700" fill="#20212a">Multi-file reception</text>
<rect x="1558.1" y="258" width="119.9" height="33" rx="16" fill="#087f85" opacity="0.11"/>
<text x="1574.125" y="281" font-size="18" font-weight="700" fill="#087f85">INCOMING</text>
<text x="929" y="346" font-size="35" font-weight="700" fill="#087f85">Copy together. Receive together.</text>
<text x="929" y="396" font-size="25" font-weight="400" fill="#20212a">Copy regular files from your controller to Ubuntu.</text>
<text x="929" y="430" font-size="25" font-weight="400" fill="#20212a">Track file and batch progress in received bytes.</text>
<text x="929" y="464" font-size="25" font-weight="400" fill="#20212a">Paste the completed batch into your file manager.</text>
