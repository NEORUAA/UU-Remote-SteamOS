<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" role="img" aria-label="从能连上，到顺手用。"><title>从能连上，到顺手用。</title><style>text{font-family:"Avenir Next","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="1774" height="887" rx="0" fill="#fffaf5" stroke="none" stroke-width="1"/><text x="80" y="55" font-size="18" font-weight="650" fill="#686976" text-anchor="start">UU REMOTE  /  UBUNTU PLUS</text><text x="80" y="144" font-size="60" font-weight="750" fill="#20212a" text-anchor="start">从能连上，到顺手用。</text><rect x="82" y="167" width="68" height="7" rx="3" fill="#ef5b24" stroke="none" stroke-width="1"/><text x="174" y="188" font-size="24" font-weight="400" fill="#686976" text-anchor="start">把改善落在中文、复制粘贴和日常窗口操作里。</text><text x="80" y="270" font-size="19" font-weight="650" fill="#686976" text-anchor="start">场景</text><text x="405" y="270" font-size="19" font-weight="650" fill="#686976" text-anchor="start">此前使用中的卡点</text><text x="1000" y="270" font-size="19" font-weight="650" fill="#7954c9" text-anchor="start">改进后的体验</text><path d="M80 302H1694" stroke="#e6ded6"/><text x="80" y="356" font-size="29" font-weight="700" fill="#20212a" text-anchor="start">手机中文</text><text x="405" y="344.0" font-size="25" font-weight="400" fill="#686976" text-anchor="start">提交后，部分文字没有进入桌面。</text><path d="M890 356h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="976" cy="354" r="16" fill="#7954c9"/><path d="M969 354 l5 5 l9 -10" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1008" y="344.0" font-size="25" font-weight="500" fill="#20212a" text-anchor="start">修正文本提交路径。</text><text x="1008" y="377.75" font-size="25" font-weight="500" fill="#20212a" text-anchor="start">直接手机中文输入已可用。</text><path d="M80 427H1694" stroke="#e6ded6"/><text x="80" y="481" font-size="29" font-weight="700" fill="#20212a" text-anchor="start">文本复制粘贴</text><text x="405" y="469.0" font-size="25" font-weight="400" fill="#686976" text-anchor="start">中继失焦时，剪贴板可能停留在旧内容。</text><path d="M890 481h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="976" cy="479" r="16" fill="#7954c9"/><path d="M969 479 l5 5 l9 -10" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1008" y="469.0" font-size="25" font-weight="500" fill="#20212a" text-anchor="start">后台刷新剪贴板内容。</text><text x="1008" y="502.75" font-size="25" font-weight="500" fill="#20212a" text-anchor="start">普通电脑文本复制粘贴正常。</text><path d="M80 552H1694" stroke="#e6ded6"/><text x="80" y="606" font-size="29" font-weight="700" fill="#20212a" text-anchor="start">管理窗口</text><text x="405" y="594.0" font-size="25" font-weight="400" fill="#686976" text-anchor="start">管理弹窗与桌面重叠，</text><text x="405" y="627.75" font-size="25" font-weight="400" fill="#686976" text-anchor="start">关闭查看器后焦点可能丢失。</text><path d="M890 606h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="976" cy="604" r="16" fill="#7954c9"/><path d="M969 604 l5 5 l9 -10" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1008" y="594.0" font-size="25" font-weight="500" fill="#20212a" text-anchor="start">管理窗口与弹窗独立捕获。</text><text x="1008" y="627.75" font-size="25" font-weight="500" fill="#20212a" text-anchor="start">双控制端切换的焦点丢失仍未解决。</text><rect x="80" y="713" width="1614" height="106" rx="22" fill="#f0eaf9" stroke="none" stroke-width="1"/><text x="111" y="751" font-size="19" font-weight="700" fill="#7954c9" text-anchor="start">Mac 日常连接</text><text x="111" y="789" font-size="24" font-weight="500" fill="#20212a" text-anchor="start">更新后：重连、中文、复制粘贴正常；4K 体验与更新前相近。</text><text x="80" y="860" font-size="18" font-weight="400" fill="#686976" text-anchor="start">来自此前已安装 Plus 版本的使用反馈 · Ubuntu 26.04 / GNOME 50 / UU 4.42</text></svg>