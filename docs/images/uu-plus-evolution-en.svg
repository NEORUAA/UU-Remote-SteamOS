<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="1040" viewBox="0 0 1774 1040" role="img" aria-label="What makes it Plus?"><title>What makes it Plus?</title><style>text{font-family:"Avenir Next","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="1774" height="1040" rx="0" fill="#fafbf8"/><text x="78" y="52" font-size="18" font-weight="650" fill="#637179">UU REMOTE / UBUNTU PLUS</text><text x="78" y="132" font-size="60" font-weight="750" fill="#202a32">What makes it Plus?</text><text x="80" y="183" font-size="25" font-weight="450" fill="#637179">Newer platforms. More control over the everyday remote desktop.</text><rect x="78" y="211" width="1618" height="59" rx="12" fill="#202a32"/><text x="99" y="249" font-size="20" font-weight="650" fill="#ffffff">AREA</text><text x="367" y="249" font-size="20" font-weight="650" fill="#c0cbc9">UPSTREAM REFERENCE</text><text x="899" y="249" font-size="20" font-weight="700" fill="#79e3d0">UBUNTU PLUS</text><text x="1494" y="249" font-size="20" font-weight="650" fill="#ffffff">CHANGE</text><rect x="78" y="270" width="1618" height="68" rx="0" fill="#ffffff"/><text x="99" y="313" font-size="24" font-weight="650" fill="#202a32">Platform</text><text x="367" y="313" font-size="22" font-weight="400" fill="#637179">Ubuntu 24.04 · GNOME 46</text><path d="M834 304h35m-8 -8 8 8-8 8" fill="none" stroke="#098f94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="899" y="313" font-size="21.5" font-weight="500" fill="#202a32">Adds 26.04 · GNOME 50; UU 4.42 by default</text><rect x="1478" y="286" width="198" height="37" rx="18" fill="#e4f4ed"/><text x="1495" y="311" font-size="18.5" font-weight="600" fill="#098f94">Compatibility</text><path d="M78 338H1696" stroke="#dae3e0"/><text x="99" y="381" font-size="24" font-weight="650" fill="#202a32">Canvas</text><text x="367" y="381" font-size="22" font-weight="400" fill="#637179">Saved resolution, /size parameter</text><path d="M834 372h35m-8 -8 8 8-8 8" fill="none" stroke="#098f94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="899" y="381" font-size="21.5" font-weight="500" fill="#202a32">720p–4K GUI presets, fit and settings recovery</text><rect x="1478" y="354" width="198" height="37" rx="18" fill="#eef2fa"/><text x="1495" y="379" font-size="18.5" font-weight="600" fill="#4565d9">New capability</text><path d="M78 406H1696" stroke="#dae3e0"/><rect x="78" y="406" width="1618" height="68" rx="0" fill="#ffffff"/><text x="99" y="449" font-size="24" font-weight="650" fill="#202a32">Chinese text</text><text x="367" y="449" font-size="22" font-weight="400" fill="#637179">Phone IME and Unicode paste</text><path d="M834 440h35m-8 -8 8 8-8 8" fill="none" stroke="#098f94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="899" y="449" font-size="21.5" font-weight="500" fill="#202a32">Repairs to committed text in Plus iterations</text><rect x="1478" y="422" width="198" height="37" rx="18" fill="#eef2fa"/><text x="1495" y="447" font-size="18.5" font-weight="600" fill="#4565d9">Iteration repair</text><path d="M78 474H1696" stroke="#dae3e0"/><text x="99" y="517" font-size="24" font-weight="650" fill="#202a32">Text paste</text><text x="367" y="517" font-size="22" font-weight="400" fill="#637179">Desktop clipboard and semantic input</text><path d="M834 508h35m-8 -8 8 8-8 8" fill="none" stroke="#098f94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="899" y="517" font-size="21.5" font-weight="500" fill="#202a32">SDL background refresh and stale-cache handling</text><rect x="1478" y="490" width="198" height="37" rx="18" fill="#eef2fa"/><text x="1495" y="515" font-size="18.5" font-weight="600" fill="#4565d9">Dependency fix</text><path d="M78 542H1696" stroke="#dae3e0"/><rect x="78" y="542" width="1618" height="68" rx="0" fill="#ffffff"/><text x="99" y="585" font-size="24" font-weight="650" fill="#202a32">Manager</text><text x="367" y="585" font-size="22" font-weight="400" fill="#637179">UU window-ID viewer</text><path d="M834 576h35m-8 -8 8 8-8 8" fill="none" stroke="#098f94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="899" y="585" font-size="21.5" font-weight="500" fill="#202a32">Separate pixmap and popup capture module</text><rect x="1478" y="558" width="198" height="37" rx="18" fill="#eef2fa"/><text x="1495" y="583" font-size="18.5" font-weight="600" fill="#4565d9">New capability</text><path d="M78 610H1696" stroke="#dae3e0"/><text x="99" y="653" font-size="24" font-weight="650" fill="#202a32">Focus</text><text x="367" y="653" font-size="22" font-weight="400" fill="#637179">Focus lease and desktop restoration</text><path d="M834 644h35m-8 -8 8 8-8 8" fill="none" stroke="#098f94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="899" y="653" font-size="21.5" font-weight="500" fill="#202a32">Focus repairs in the Plus manager-view iterations</text><rect x="1478" y="626" width="198" height="37" rx="18" fill="#eef2fa"/><text x="1495" y="651" font-size="18.5" font-weight="600" fill="#4565d9">Iteration repair</text><path d="M78 678H1696" stroke="#dae3e0"/><rect x="78" y="678" width="1618" height="68" rx="0" fill="#ffffff"/><text x="99" y="721" font-size="24" font-weight="650" fill="#202a32">Tools</text><text x="367" y="721" font-size="22" font-weight="400" fill="#637179">UU commands and installer</text><path d="M834 712h35m-8 -8 8 8-8 8" fill="none" stroke="#098f94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="899" y="721" font-size="21.5" font-weight="500" fill="#202a32">Quality GUI, launchers, local font and DPI settings</text><rect x="1478" y="694" width="198" height="37" rx="18" fill="#eef2fa"/><text x="1495" y="719" font-size="18.5" font-weight="600" fill="#4565d9">New capability</text><path d="M78 746H1696" stroke="#dae3e0"/><text x="80" y="804" font-size="30" font-weight="700" fill="#202a32">What should these designs improve?</text><text x="80" y="839" font-size="17" font-weight="650" fill="#098f94">DESIGN EXPECTATIONS</text><rect x="78" y="862" width="526" height="98" rx="14" fill="#ffffff"/><rect x="78" y="880" width="4" height="61" rx="2" fill="#098f94"/><text x="101" y="899" font-size="26" font-weight="700" fill="#202a32">A desktop that fits</text><text x="101" y="938" font-size="20" font-weight="400" fill="#637179">Canvas fitting and pointer geometry together.</text><rect x="624" y="862" width="526" height="98" rx="14" fill="#ffffff"/><rect x="624" y="880" width="4" height="61" rx="2" fill="#4565d9"/><text x="647" y="899" font-size="26" font-weight="700" fill="#202a32">Fewer interruptions</text><text x="647" y="938" font-size="20" font-weight="400" fill="#637179">Background paste and separate manager capture.</text><rect x="1170" y="862" width="526" height="98" rx="14" fill="#ffffff"/><rect x="1170" y="880" width="4" height="61" rx="2" fill="#098f94"/><text x="1193" y="899" font-size="26" font-weight="700" fill="#202a32">An easier upgrade</text><text x="1193" y="938" font-size="20" font-weight="400" fill="#637179">Version support and recoverable settings.</text><text x="80" y="1004" font-size="17" font-weight="400" fill="#637179">Upstream: e2854e2b · Lachlan Chen · Expectations describe direction; see the guide for performance measurement.</text></svg>