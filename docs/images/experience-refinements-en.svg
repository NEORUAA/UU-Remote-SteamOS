<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" role="img" aria-label="Connected. Then more usable."><title>Connected. Then more usable.</title><style>text{font-family:"Avenir Next","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="1774" height="887" rx="0" fill="#fffaf5" stroke="none" stroke-width="1"/><text x="80" y="55" font-size="18" font-weight="650" fill="#686976" text-anchor="start">UU REMOTE  /  UBUNTU PLUS</text><text x="80" y="144" font-size="60" font-weight="750" fill="#20212a" text-anchor="start">Connected. Then more usable.</text><rect x="82" y="167" width="68" height="7" rx="3" fill="#ef5b24" stroke="none" stroke-width="1"/><text x="174" y="188" font-size="24" font-weight="400" fill="#686976" text-anchor="start">Refinements in text, paste and everyday window handling.</text><text x="80" y="270" font-size="19" font-weight="650" fill="#686976" text-anchor="start">SCENE</text><text x="405" y="270" font-size="19" font-weight="650" fill="#686976" text-anchor="start">BEFORE THE REFINEMENTS</text><text x="1000" y="270" font-size="19" font-weight="650" fill="#7954c9" text-anchor="start">AFTER THE REFINEMENTS</text><path d="M80 302H1694" stroke="#e6ded6"/><text x="80" y="356" font-size="29" font-weight="700" fill="#20212a" text-anchor="start">Phone text</text><text x="405" y="344.0" font-size="25" font-weight="400" fill="#686976" text-anchor="start">Some committed text did not</text><text x="405" y="377.75" font-size="25" font-weight="400" fill="#686976" text-anchor="start">reach the desktop.</text><path d="M890 356h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="976" cy="354" r="16" fill="#7954c9"/><path d="M969 354 l5 5 l9 -10" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1008" y="344.0" font-size="25" font-weight="500" fill="#20212a" text-anchor="start">Repaired committed-text routing.</text><text x="1008" y="377.75" font-size="25" font-weight="500" fill="#20212a" text-anchor="start">Direct phone Chinese input worked.</text><path d="M80 427H1694" stroke="#e6ded6"/><text x="80" y="481" font-size="29" font-weight="700" fill="#20212a" text-anchor="start">Copy &amp; paste</text><text x="405" y="469.0" font-size="25" font-weight="400" fill="#686976" text-anchor="start">Clipboard content could stay stale</text><text x="405" y="502.75" font-size="25" font-weight="400" fill="#686976" text-anchor="start">when the relay lost focus.</text><path d="M890 481h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="976" cy="479" r="16" fill="#7954c9"/><path d="M969 479 l5 5 l9 -10" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1008" y="469.0" font-size="25" font-weight="500" fill="#20212a" text-anchor="start">Clipboard changes refresh in the background.</text><text x="1008" y="502.75" font-size="25" font-weight="500" fill="#20212a" text-anchor="start">Ordinary computer text copy/paste worked.</text><path d="M80 552H1694" stroke="#e6ded6"/><text x="80" y="606" font-size="29" font-weight="700" fill="#20212a" text-anchor="start">Manager view</text><text x="405" y="594.0" font-size="25" font-weight="400" fill="#686976" text-anchor="start">Popups could overlap the desktop;</text><text x="405" y="627.75" font-size="25" font-weight="400" fill="#686976" text-anchor="start">viewer closure could leave focus behind.</text><path d="M890 606h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="976" cy="604" r="16" fill="#7954c9"/><path d="M969 604 l5 5 l9 -10" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="1008" y="594.0" font-size="25" font-weight="500" fill="#20212a" text-anchor="start">Manager windows and popups use their own capture.</text><text x="1008" y="627.75" font-size="25" font-weight="500" fill="#20212a" text-anchor="start">Dual-controller focus loss remains unresolved.</text><rect x="80" y="713" width="1614" height="106" rx="22" fill="#f0eaf9" stroke="none" stroke-width="1"/><text x="111" y="751" font-size="19" font-weight="700" fill="#7954c9" text-anchor="start">EVERYDAY MAC CONNECTION</text><text x="111" y="789" font-size="24" font-weight="500" fill="#20212a" text-anchor="start">After the app update: reconnect, Chinese text and paste worked; 4K responsiveness felt similar.</text><text x="80" y="860" font-size="18" font-weight="400" fill="#686976" text-anchor="start">User feedback from an earlier installed Plus iteration · Ubuntu 26.04 / GNOME 50 / UU 4.42</text></svg>