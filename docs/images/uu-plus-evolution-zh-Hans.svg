<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="1040" viewBox="0 0 1774 1040" role="img" aria-label="Plus，多了什么？"><title>Plus，多了什么？</title><style>text{font-family:"Avenir Next","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="1774" height="1040" rx="0" fill="#fafbf8"/><text x="78" y="52" font-size="18" font-weight="650" fill="#637179">UU REMOTE / UBUNTU PLUS</text><text x="78" y="132" font-size="60" font-weight="750" fill="#202a32">Plus，多了什么？</text><text x="80" y="183" font-size="25" font-weight="450" fill="#637179">把新平台接上，把每天的远程操作磨顺。</text><rect x="78" y="211" width="1618" height="59" rx="12" fill="#202a32"/><text x="99" y="249" font-size="20" font-weight="650" fill="#ffffff">功能</text><text x="367" y="249" font-size="20" font-weight="650" fill="#c0cbc9">上游参考版本</text><text x="899" y="249" font-size="20" font-weight="700" fill="#79e3d0">UBUNTU PLUS</text><text x="1494" y="249" font-size="20" font-weight="650" fill="#ffffff">变化类型</text><rect x="78" y="270" width="1618" height="68" rx="0" fill="#ffffff"/><text x="99" y="313" font-size="24" font-weight="650" fill="#202a32">平台版本</text><text x="367" y="313" font-size="22" font-weight="400" fill="#637179">Ubuntu 24.04 · GNOME 46</text><path d="M834 304h35m-8 -8 8 8-8 8" fill="none" stroke="#098f94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="899" y="313" font-size="21.5" font-weight="500" fill="#202a32">新增 26.04 · GNOME 50；默认 UU 4.42</text><rect x="1478" y="286" width="198" height="37" rx="18" fill="#e4f4ed"/><text x="1495" y="311" font-size="18.5" font-weight="600" fill="#098f94">版本适配</text><path d="M78 338H1696" stroke="#dae3e0"/><text x="99" y="381" font-size="24" font-weight="650" fill="#202a32">桌面画布</text><text x="367" y="381" font-size="22" font-weight="400" fill="#637179">保存分辨率，使用 /size 参数</text><path d="M834 372h35m-8 -8 8 8-8 8" fill="none" stroke="#098f94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="899" y="381" font-size="21.5" font-weight="500" fill="#202a32">720p—4K 四档界面、缩放适配、设置恢复</text><rect x="1478" y="354" width="198" height="37" rx="18" fill="#eef2fa"/><text x="1495" y="379" font-size="18.5" font-weight="600" fill="#4565d9">新增能力</text><path d="M78 406H1696" stroke="#dae3e0"/><rect x="78" y="406" width="1618" height="68" rx="0" fill="#ffffff"/><text x="99" y="449" font-size="24" font-weight="650" fill="#202a32">中文输入</text><text x="367" y="449" font-size="22" font-weight="400" fill="#637179">已有手机输入法与 Unicode 语义粘贴</text><path d="M834 440h35m-8 -8 8 8-8 8" fill="none" stroke="#098f94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="899" y="449" font-size="21.5" font-weight="500" fill="#202a32">修正 Plus 迭代中的文本提交路径</text><rect x="1478" y="422" width="198" height="37" rx="18" fill="#eef2fa"/><text x="1495" y="447" font-size="18.5" font-weight="600" fill="#4565d9">迭代修正</text><path d="M78 474H1696" stroke="#dae3e0"/><text x="99" y="517" font-size="24" font-weight="650" fill="#202a32">文本粘贴</text><text x="367" y="517" font-size="22" font-weight="400" fill="#637179">已有桌面剪贴板与语义输入</text><path d="M834 508h35m-8 -8 8 8-8 8" fill="none" stroke="#098f94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="899" y="517" font-size="21.5" font-weight="500" fill="#202a32">SDL 后台刷新、内容变更与旧缓存处理</text><rect x="1478" y="490" width="198" height="37" rx="18" fill="#eef2fa"/><text x="1495" y="515" font-size="18.5" font-weight="600" fill="#4565d9">依赖修正</text><path d="M78 542H1696" stroke="#dae3e0"/><rect x="78" y="542" width="1618" height="68" rx="0" fill="#ffffff"/><text x="99" y="585" font-size="24" font-weight="650" fill="#202a32">管理与弹窗</text><text x="367" y="585" font-size="22" font-weight="400" fill="#637179">以窗口 ID 查看 UU 管理窗口</text><path d="M834 576h35m-8 -8 8 8-8 8" fill="none" stroke="#098f94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="899" y="585" font-size="21.5" font-weight="500" fill="#202a32">独立 pixmap 与弹窗捕获模块</text><rect x="1478" y="558" width="198" height="37" rx="18" fill="#eef2fa"/><text x="1495" y="583" font-size="18.5" font-weight="600" fill="#4565d9">新增能力</text><path d="M78 610H1696" stroke="#dae3e0"/><text x="99" y="653" font-size="24" font-weight="650" fill="#202a32">焦点切换</text><text x="367" y="653" font-size="22" font-weight="400" fill="#637179">已有焦点租约与桌面恢复逻辑</text><path d="M834 644h35m-8 -8 8 8-8 8" fill="none" stroke="#098f94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="899" y="653" font-size="21.5" font-weight="500" fill="#202a32">修正 Plus 管理视图迭代中的焦点遗留</text><rect x="1478" y="626" width="198" height="37" rx="18" fill="#eef2fa"/><text x="1495" y="651" font-size="18.5" font-weight="600" fill="#4565d9">迭代修正</text><path d="M78 678H1696" stroke="#dae3e0"/><rect x="78" y="678" width="1618" height="68" rx="0" fill="#ffffff"/><text x="99" y="721" font-size="24" font-weight="650" fill="#202a32">常用工具</text><text x="367" y="721" font-size="22" font-weight="400" fill="#637179">UU 命令和安装入口</text><path d="M834 712h35m-8 -8 8 8-8 8" fill="none" stroke="#098f94" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="899" y="721" font-size="21.5" font-weight="500" fill="#202a32">画质工具、连接启动器、局部字体与 DPI</text><rect x="1478" y="694" width="198" height="37" rx="18" fill="#eef2fa"/><text x="1495" y="719" font-size="18.5" font-weight="600" fill="#4565d9">新增能力</text><path d="M78 746H1696" stroke="#dae3e0"/><text x="80" y="804" font-size="30" font-weight="700" fill="#202a32">这些设计，想带来什么？</text><text x="80" y="839" font-size="17" font-weight="650" fill="#098f94">设计预期</text><rect x="78" y="862" width="526" height="98" rx="14" fill="#ffffff"/><rect x="78" y="880" width="4" height="61" rx="2" fill="#098f94"/><text x="101" y="899" font-size="26" font-weight="700" fill="#202a32">看得完整</text><text x="101" y="938" font-size="20" font-weight="400" fill="#637179">缩放适配与指针几何一起处理。</text><rect x="624" y="862" width="526" height="98" rx="14" fill="#ffffff"/><rect x="624" y="880" width="4" height="61" rx="2" fill="#4565d9"/><text x="647" y="899" font-size="26" font-weight="700" fill="#202a32">操作少打断</text><text x="647" y="938" font-size="20" font-weight="400" fill="#637179">后台粘贴与管理视图分路。</text><rect x="1170" y="862" width="526" height="98" rx="14" fill="#ffffff"/><rect x="1170" y="880" width="4" height="61" rx="2" fill="#098f94"/><text x="1193" y="899" font-size="26" font-weight="700" fill="#202a32">升级更从容</text><text x="1193" y="938" font-size="20" font-weight="400" fill="#637179">版本适配与可恢复设置。</text><text x="80" y="1004" font-size="17" font-weight="400" fill="#637179">上游参考 e2854e2b · Lachlan Chen · 设计预期表示作用方向；数值性能见测量方法。</text></svg>