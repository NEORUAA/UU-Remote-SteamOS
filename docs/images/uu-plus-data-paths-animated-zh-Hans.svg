<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" role="img" aria-labelledby="title desc"><title id="title">桌面在这里，操作从任何屏幕回来。</title><desc id="desc">桌面在这里，操作从任何屏幕回来。</desc><style>text{font-family:"Avenir Next","PingFang SC","Noto Sans CJK SC",sans-serif}.signal{stroke-dasharray:18 142;stroke-dashoffset:0;animation:travel 4.8s linear infinite}.return{animation-delay:-2.4s}@keyframes travel{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.signal{animation:none;display:none}}</style><defs><linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55e5c2"/><stop offset="1" stop-color="#0aa0b2"/></linearGradient><linearGradient id="cobalt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7cbbfa"/><stop offset="1" stop-color="#4d63de"/></linearGradient><marker id="mintArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#159fae" stroke-width="2"/></marker><marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#536ee5" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1774" height="887" rx="0" fill="#f8f8f4" stroke="none"/><text x="80" y="55" fill="#717d87" font-size="17" font-weight="650" text-anchor="start">UU REMOTE / UBUNTU PLUS</text><text x="80" y="134" fill="#222733" font-size="55" font-weight="750" text-anchor="start">桌面在这里，操作从任何屏幕回来。</text><text x="83" y="178" fill="#717d87" font-size="23" font-weight="400" text-anchor="start">画面向外，输入返回。账号与设置走独立的管理窗口。</text><rect x="80" y="216" width="125" height="31" rx="9" fill="#e8f8f3" stroke="none"/><text x="92" y="238" fill="#099fac" font-size="16" font-weight="650" text-anchor="start">UBUNTU</text><rect x="612" y="216" width="174" height="31" rx="9" fill="#e8f8f3" stroke="none"/><text x="624" y="238" fill="#099fac" font-size="16" font-weight="650" text-anchor="start">PLUS BRIDGE</text><rect x="1340" y="216" width="174" height="31" rx="9" fill="#edf2ff" stroke="none"/><text x="1352" y="238" fill="#536ee5" font-size="16" font-weight="650" text-anchor="start">CONTROLLER</text><rect x="80" y="272" width="400" height="333" rx="24" fill="white" stroke="#dce3e4"/><rect x="612" y="272" width="552" height="333" rx="24" fill="white" stroke="#dce3e4"/><rect x="1340" y="272" width="354" height="333" rx="24" fill="#202833" stroke="none"/><text x="112" y="315" fill="#222733" font-size="26" font-weight="700" text-anchor="start">真实桌面会话</text><text x="112" y="350" fill="#717d87" font-size="19" font-weight="400" text-anchor="start">GNOME · 应用 · 文件</text><rect x="112" y="380" width="336" height="130" rx="12" fill="#202833" stroke="none"/><rect x="123" y="391" width="142" height="108" rx="7" fill="#303c4b" stroke="none"/><rect x="275" y="391" width="163" height="108" rx="7" fill="#283544" stroke="none"/><rect x="139" y="407" width="103" height="3" rx="1.5" fill="#76d8c2" stroke="none"/><rect x="139" y="424" width="79" height="3" rx="1.5" fill="#76d8c2" stroke="none"/><rect x="139" y="441" width="96" height="3" rx="1.5" fill="#76d8c2" stroke="none"/><rect x="139" y="458" width="66" height="3" rx="1.5" fill="#76d8c2" stroke="none"/><rect x="289" y="407" width="124" height="3" rx="1.5" fill="#91a9ef" stroke="none"/><rect x="289" y="424" width="99" height="3" rx="1.5" fill="#91a9ef" stroke="none"/><rect x="289" y="441" width="79" height="3" rx="1.5" fill="#91a9ef" stroke="none"/><rect x="112" y="539" width="181" height="31" rx="9" fill="#e8f8f3" stroke="none"/><text x="124" y="561" fill="#099fac" font-size="16" font-weight="650" text-anchor="start">GNOME RDP</text><text x="644" y="315" fill="#222733" font-size="26" font-weight="700" text-anchor="start">桌面中继</text><text x="644" y="350" fill="#717d87" font-size="20" font-weight="600" text-anchor="start">SDL / FreeRDP</text><rect x="644" y="380" width="488" height="70" rx="12" fill="#e8f8f3" stroke="none"/><text