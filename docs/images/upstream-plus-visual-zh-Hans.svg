<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" role="img" aria-label="同一条桥，更多顺手的细节。"><title>同一条桥，更多顺手的细节。</title><style>text{font-family:"Avenir Next","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="1774" height="887" rx="0" fill="#fffaf5" stroke="none" stroke-width="1"/><text x="80" y="55" font-size="18" font-weight="650" fill="#686976" text-anchor="start">UU REMOTE  /  UBUNTU PLUS</text><text x="80" y="144" font-size="60" font-weight="750" fill="#20212a" text-anchor="start">同一条桥，更多顺手的细节。</text><rect x="82" y="167" width="68" height="7" rx="3" fill="#ef5b24" stroke="none" stroke-width="1"/><text x="174" y="188" font-size="24" font-weight="400" fill="#686976" text-anchor="start">保留上游基础，把新版兼容与日常操作继续打磨。</text><text x="80" y="272" font-size="19" font-weight="650" fill="#686976" text-anchor="start">功能</text><text x="405" y="272" font-size="19" font-weight="650" fill="#686976" text-anchor="start">上游参考版本</text><text x="1010" y="272" font-size="19" font-weight="700" fill="#7954c9" text-anchor="start">UBUNTU PLUS</text><path d="M80 303H1694" stroke="#e6ded6"/><text x="80" y="339" font-size="25" font-weight="700" fill="#20212a" text-anchor="start">Ubuntu 兼容</text><text x="405" y="339.0" font-size="23" font-weight="400" fill="#686976" text-anchor="start">Ubuntu 24.04 / GNOME 46</text><path d="M910 331h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1010" y="339.0" font-size="23" font-weight="550" fill="#20212a" text-anchor="start">保留 24.04，适配 26.04 / GNOME 50</text><path d="M80 379H1694" stroke="#e6ded6"/><text x="80" y="415" font-size="25" font-weight="700" fill="#20212a" text-anchor="start">UU 版本</text><text x="405" y="415.0" font-size="23" font-weight="400" fill="#686976" text-anchor="start">默认 UU 4.33</text><path d="M910 407h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1010" y="415.0" font-size="23" font-weight="550" fill="#20212a" text-anchor="start">默认 UU 4.42</text><path d="M80 455H1694" stroke="#e6ded6"/><text x="80" y="491" font-size="25" font-weight="700" fill="#20212a" text-anchor="start">桌面画布</text><text x="405" y="491.0" font-size="23" font-weight="400" fill="#686976" text-anchor="start">已保存的分辨率参数</text><path d="M910 483h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1010" y="491.0" font-size="23" font-weight="550" fill="#20212a" text-anchor="start">720p → 4K 图形选择、状态与设置恢复</text><path d="M80 531H1694" stroke="#e6ded6"/><text x="80" y="567" font-size="25" font-weight="700" fill="#20212a" text-anchor="start">中文与剪贴板</text><text x="405" y="567.0" font-size="23" font-weight="400" fill="#686976" text-anchor="start">已有手机输入法与 Unicode 粘贴</text><path d="M910 559h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1010" y="567.0" font-size="23" font-weight="550" fill="#20212a" text-anchor="start">修正文本提交、后台刷新与旧内容失效</text><path d="M80 607H1694" stroke="#e6ded6"/><text x="80" y="643" font-size="25" font-weight="700" fill="#20212a" text-anchor="start">UU 管理窗口</text><text x="405" y="643.0" font-size="23" font-weight="400" fill="#686976" text-anchor="start">已有本地窗口查看器</text><path d="M910 635h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1010" y="643.0" font-size="23" font-weight="550" fill="#20212a" text-anchor="start">独立捕获管理窗口与弹窗，关闭后回到桌面</text><path d="M80 683H1694" stroke="#e6ded6"/><text x="80" y="719" font-size="25" font-weight="700" fill="#20212a" text-anchor="start">中继构建</text><text x="405" y="719.0" font-size="23" font-weight="400" fill="#686976" text-anchor="start">固定版本的预编译 SDL 客户端</text><path d="M910 711h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1010" y="719.0" font-size="23" font-weight="550" fill="#20212a" text-anchor="start">固定源码构建、运行组件校验与可复现产物</text><text x="80" y="855" font-size="18" font-weight="400" fill="#686976" text-anchor="start">上游参考：e2854e2b · 原作者 Lachlan Chen · 具体代码与版本来源见上游对比文档</text></svg>