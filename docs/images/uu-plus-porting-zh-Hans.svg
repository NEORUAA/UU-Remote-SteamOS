<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" role="img" aria-labelledby="title desc"><title id="title">桌面后端</title><desc id="desc">桌面后端</desc><style>text{font-family:"Avenir Next","PingFang SC","Noto Sans CJK SC",sans-serif}.signal{stroke-dasharray:18 142;stroke-dashoffset:0;animation:travel 4.8s linear infinite}.return{animation-delay:-2.4s}@keyframes travel{to{stroke-dashoffset:-160}}@media(prefers-reduced-motion:reduce){.signal{animation:none;display:none}}</style><defs><linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#55e5c2"/><stop offset="1" stop-color="#0aa0b2"/></linearGradient><linearGradient id="cobalt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7cbbfa"/><stop offset="1" stop-color="#4d63de"/></linearGradient><marker id="mintArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#159fae" stroke-width="2"/></marker><marker id="blueArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 1L8 5L0 9" fill="none" stroke="#536ee5" stroke-width="2"/></marker></defs><rect x="0" y="0" width="1774" height="887" rx="0" fill="#f8f8f4" stroke="none"/><text x="80" y="55" fill="#717d87" font-size="17" font-weight="650" text-anchor="start">UU REMOTE / UBUNTU PLUS</text><text x="80" y="134" fill="#222733" font-size="55" font-weight="750" text-anchor="start">一条桥，三层适配。</text><text x="83" y="178" fill="#717d87" font-size="23" font-weight="400" text-anchor="start">保留中继核心，把发行版和桌面集成接上。</text><rect x="80" y="250" width="500" height="483" rx="25" fill="white" stroke="#dce3e4"/><text x="108" y="298" fill="#099fac" font-size="22" font-weight="700" text-anchor="start">01</text><text x="108" y="343" fill="#222733" font-size="31" font-weight="700" text-anchor="start">桥接核心</text><text x="108" y="377" fill="#717d87" font-size="19" font-weight="450" text-anchor="start">保留与复用</text><path d="M108 408H552" stroke="#dce3e4" stroke-width="2" fill="none" /><text x="108" y="433" fill="#222733" font-size="21" font-weight="650" text-anchor="start">Wine / UU</text><text x="108" y="460" fill="#717d87" font-size="18" font-weight="400" text-anchor="start">UU 兼容与运行环境</text><path d="M108 476H552" stroke="#dce3e4" stroke-width="2" fill="none" /><text x="108" y="501" fill="#222733" font-size="21" font-weight="650" text-anchor="start">SDL / FreeRDP</text><text x="108" y="528" fill="#717d87" font-size="18" font-weight="400" text-anchor="start">画面中继与公开输入接口</text><path d="M108 544H552" stroke="#dce3e4" stroke-width="2" fill="none" /><text x="108" y="569" fill="#222733" font-size="21" font-weight="650" text-anchor="start">Input broker</text><text x="108" y="596" fill="#717d87" font-size="18" font-weight="400" text-anchor="start">键鼠事件与 Unicode 文本</text><path d="M108 612H552" stroke="#dce3e4" stroke-width="2" fill="none" /><text x="108" y="637" fill="#222733" font-size="21" font-weight="650" text-anchor="start">Private canvas</text><text x="108" y="664" fill="#717d87" font-size="18" font-weight="400" text-anchor="start">桌面画布与独立管理窗口</text><rect x="637" y="250" width="500" height="483" rx="25" fill="white" stroke="#dce3e4"/><text x="665" y="298" fill="#099fac" font-size="22" font-weight="700" text-anchor="start">02</text><text x="665" y="343" fill="#222733" font-size="31" font-weight="700" text-anchor="start">发行版集成</text><text x="665" y="377" fill="#717d87" font-size="19" font-weight="450" text-anchor="start">按平台调整</text><path d="M665 408H1109" stroke="#dce3e4" stroke-width="2" fill="none" /><text x="665" y="433" fill="#222733" font-size="21" font-weight="650" text-anchor="start">Packages</text><text x="665" y="460" fill="#717d87" font-size="18" font-weight="400" text-anchor="start">包名、依赖与版本</text><path d="M665 476H1109" stroke="#dce3e4" stroke-width="2" fill="none" /><text x="665" y="501" fill="#222733" font-size="21" font-weight="650" text-anchor="start">Wine layout</text><text x="665" y="528" fill="#717d87" font-size="18" font-weight="400" text-anchor="start">路径、运行前缀与字体</text><path d="M665 544H1109" stroke="#dce3e4" stroke-width="2" fill="none" /><text x="665" y="569" fill="#222733" font-size="21" font-weight="650" text-anchor="start">Service lifecycle</text><text x="665" y="596" fill="#717d87" font-size="18" font-weight="400" text-anchor="start">用户服务、启动与恢复</text><path d="M665 612H1109" stroke="#dce3e4" stroke-width="2" fill="none" /><text x="665" y="637" fill="#222733" font-size="21" font-weight="650" text-anchor="start">Installer</text><text x="665" y="664" fill="#717d87" font-size="18" font-weight="400" text-anchor="start">构建、安装、卸载与回滚</text><rect x="1194" y="250" width="500" height="483" rx="25" fill="white" stroke="#dce3e4"/><text x="1222" y="298" fill="#099fac" font-size="22" font-weight="700" text-anchor="start">03</text><text x="1222" y="343" fill="#222733" font-size="31" font-weight="700" text-anchor="start">桌面后端</text><text x="1222" y="377" fill="#717d87" font-size="19" font-weight="450" text-anchor="start">按桌面接入</text><path d="M1222 408H1666" stroke="#dce3e4" stroke-width="2" fill="none" /><text x="1222" y="433" fill="#222733" font-size="21" font-weight="650" text-anchor="start">Capture</text><text x="1222" y="460" fill="#717d87" font-size="18" font-weight="400" text-anchor="start">捕获与窗口合成</text><path d="M1222 476H1666" stroke="#dce3e4" stroke-width="2" fill="none" /><text x="1222" y="501" fill="#222733" font-size="21" font-weight="650" text-anchor="start">Input / clipboard</text><text x="1222" y="528" fill="#717d87" font-size="18" font-weight="400" text-anchor="start">键鼠注入与文字剪贴板</text><path d="M1222 544H1666" stroke="#dce3e4" stroke-width="2" fill="none" /><text x="1222" y="569" fill="#222733" font-size="21" font-weight="650" text-anchor="start">Displays</text><text x="1222" y="596" fill="#717d87" font-size="18" font-weight="400" text-anchor="start">输出、画布与会话发现</text><path d="M1222 612H1666" stroke="#dce3e4" stroke-width="2" fill="none" /><text x="1222" y="637" fill="#222733" font-size="21" font-weight="650" text-anchor="start">Desktop actions</text><text x="1222" y="664" fill="#717d87" font-size="18" font-weight="400" text-anchor="start">显示桌面、概览与菜单</text><rect x="80" y="763" width="1614" height="74" rx="16" fill="#edf2ff" stroke="none"/><text x="111" y="794" fill="#222733" font-size="22" font-weight="600" text-anchor="start">GNOME：可复用更多现有集成   ·   KDE / Xfce：接入对应桌面后端</text><text x="111" y="821" fill="#717d87" font-size="18" font-weight="400" text-anchor="start">当前安装器：x86-64 Ubuntu 24.04 / 26.04</text></svg>