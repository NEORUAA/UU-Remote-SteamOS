<svg xmlns="http://www.w3.org/2000/svg" width="1774" height="887" viewBox="0 0 1774 887" role="img" aria-label="One bridge. More useful details."><title>One bridge. More useful details.</title><style>text{font-family:"Avenir Next","PingFang SC","Noto Sans CJK SC",sans-serif}</style><rect x="0" y="0" width="1774" height="887" rx="0" fill="#fffaf5" stroke="none" stroke-width="1"/><text x="80" y="55" font-size="18" font-weight="650" fill="#686976" text-anchor="start">UU REMOTE  /  UBUNTU PLUS</text><text x="80" y="144" font-size="60" font-weight="750" fill="#20212a" text-anchor="start">One bridge. More useful details.</text><rect x="82" y="167" width="68" height="7" rx="3" fill="#ef5b24" stroke="none" stroke-width="1"/><text x="174" y="188" font-size="24" font-weight="400" fill="#686976" text-anchor="start">Built on the upstream foundation, refined for newer versions and everyday use.</text><text x="80" y="272" font-size="19" font-weight="650" fill="#686976" text-anchor="start">AREA</text><text x="405" y="272" font-size="19" font-weight="650" fill="#686976" text-anchor="start">UPSTREAM REFERENCE</text><text x="1010" y="272" font-size="19" font-weight="700" fill="#7954c9" text-anchor="start">UBUNTU PLUS</text><path d="M80 303H1694" stroke="#e6ded6"/><text x="80" y="339" font-size="25" font-weight="700" fill="#20212a" text-anchor="start">Ubuntu</text><text x="405" y="339.0" font-size="23" font-weight="400" fill="#686976" text-anchor="start">Ubuntu 24.04 / GNOME 46</text><path d="M910 331h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1010" y="339.0" font-size="23" font-weight="550" fill="#20212a" text-anchor="start">24.04 retained; 26.04 / GNOME 50 added</text><path d="M80 379H1694" stroke="#e6ded6"/><text x="80" y="415" font-size="25" font-weight="700" fill="#20212a" text-anchor="start">UU version</text><text x="405" y="415.0" font-size="23" font-weight="400" fill="#686976" text-anchor="start">UU 4.33 by default</text><path d="M910 407h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1010" y="415.0" font-size="23" font-weight="550" fill="#20212a" text-anchor="start">UU 4.42 by default</text><path d="M80 455H1694" stroke="#e6ded6"/><text x="80" y="491" font-size="25" font-weight="700" fill="#20212a" text-anchor="start">Canvas</text><text x="405" y="491.0" font-size="23" font-weight="400" fill="#686976" text-anchor="start">Saved resolution parameter</text><path d="M910 483h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1010" y="491.0" font-size="23" font-weight="550" fill="#20212a" text-anchor="start">720p to 4K GUI presets, status and recovery</text><path d="M80 531H1694" stroke="#e6ded6"/><text x="80" y="567" font-size="25" font-weight="700" fill="#20212a" text-anchor="start">Text &amp; clipboard</text><text x="405" y="567.0" font-size="23" font-weight="400" fill="#686976" text-anchor="start">Phone IME and Unicode paste already exist</text><path d="M910 559h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1010" y="567.0" font-size="23" font-weight="550" fill="#20212a" text-anchor="start">Text-routing repairs and background clipboard refresh</text><path d="M80 607H1694" stroke="#e6ded6"/><text x="80" y="643" font-size="25" font-weight="700" fill="#20212a" text-anchor="start">Manager</text><text x="405" y="643.0" font-size="23" font-weight="400" fill="#686976" text-anchor="start">Local window viewer already exists</text><path d="M910 635h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1010" y="643.0" font-size="23" font-weight="550" fill="#20212a" text-anchor="start">Separate window/popup capture; close to restore focus</text><path d="M80 683H1694" stroke="#e6ded6"/><text x="80" y="719" font-size="25" font-weight="700" fill="#20212a" text-anchor="start">Relay build</text><text x="405" y="719.0" font-size="23" font-weight="400" fill="#686976" text-anchor="start">Pinned prebuilt SDL client</text><path d="M910 711h60m-15 -12 15 12-15 12" fill="none" stroke="#ef5b24" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="1010" y="719.0" font-size="23" font-weight="550" fill="#20212a" text-anchor="start">Pinned source build, runtime checks, reproducible outputs</text><text x="80" y="855" font-size="18" font-weight="400" fill="#686976" text-anchor="start">Upstream reference: e2854e2b · Lachlan Chen · Implementation and version sources in the comparison guide</text></svg>