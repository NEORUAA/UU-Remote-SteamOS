name: validate-steamos-source
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Check shell syntax
        run: bash -n install.sh scripts/build-compat.sh
      - name: Check Python source
        run: python3 -m compileall -q scripts tests
      - name: Run portable tests
        run: python3 -B -m unittest discover -s tests -v
      - name: Verify release manifests
        run: python3 -B scripts/patch-gameviewer.py manifests
